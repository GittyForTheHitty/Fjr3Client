<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min hemsida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;

        }

            color: white;

            color: white;
            cursor: pointer;
        }

<body>

    <header>
        <h1>Min hemsida</h1>
        <p>Välkommen!</p>
    </header>

    <main>
        <h2>Hej 👋</h2>
        <p>Det här är min första hemsida.</p>

        <button onclick="alert('Hej!')">
            Klicka här
        </button>
    </main>

</html>
